<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- 1200x630 social preview. build.mjs fills the text from the query string. -->
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --kd-red: #C8102E; --kd-gold: #BD9B60; --kd-deep: #76232F; --kd-ink: #2A1A1D; --kd-cream: #F6EEE3; --kd-white: #FFFFFF;
          --kd-ink-soft: color-mix(in srgb, var(--kd-ink) 82%, var(--kd-cream));
          --kd-cream-soft: color-mix(in srgb, var(--kd-cream) 92%, var(--kd-gold));
          --kd-font-display: "Cinzel", "Trajan Pro", "Times New Roman", serif;
          --kd-font-body: "Jost", Futura, "Century Gothic", "Helvetica Neue", Arial, sans-serif; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: var(--kd-cream); color: var(--kd-ink); font-family: var(--kd-font-body); position: relative; }
  .pattern { position: absolute; inset: 0; background: url("../../assets/brand/pattern/KirkaDay_Pattern_Seamless_FullColor_Transparent_2048px.webp") 0 0 / 320px auto repeat; opacity: 0.06; }
  .band { position: absolute; left: 0; right: 0; bottom: 0; height: 14px; background: var(--kd-red); }
  .copy { position: absolute; left: 84px; top: 0; bottom: 14px; width: 610px; display: flex; flex-direction: column; justify-content: center; }
  /* The lockup carries its own clear space; the negative margin lines its artwork up with the copy. */
  .brand { margin: 0 0 30px -24px; background: var(--kd-cream); align-self: flex-start; }
  .brand img { height: 110px; width: auto; display: block; }
  .eyebrow { font-size: 17px; font-weight: 500; letter-spacing: 0.3em; text-transform: uppercase; color: var(--kd-deep); margin: 0 0 18px; }
  h1 { font-family: var(--kd-font-display); font-weight: 700; font-size: 52px; line-height: 1.12; margin: 0 0 22px; color: var(--kd-ink); letter-spacing: 0.01em; }
  .sub { font-family: var(--kd-font-body); font-size: 26px; line-height: 1.4; color: var(--kd-ink-soft); margin: 0; max-width: 21em; }
  .sub b { font-weight: 500; color: var(--kd-red); }
  .rule { width: 64px; height: 2px; background: var(--kd-gold); margin: 32px 0 20px; }
  .url { font-size: 18px; font-weight: 500; letter-spacing: 0.28em; text-transform: uppercase; color: var(--kd-deep); }
  .can { position: absolute; right: 84px; top: var(--ftop, 42px); width: 360px; height: var(--fh, 574px); overflow: hidden;
         border: 1px solid rgba(189,155,96,0.6); border-radius: 180px 180px 6px 6px; background: var(--kd-cream);
         box-shadow: 0 40px 70px -40px rgba(42,26,29,0.45); }
  .can img { position: absolute; width: var(--w, 800px); left: var(--left, -231px); top: var(--top, -178px); }
  .can .plate { position: absolute; left: 0; right: 0; bottom: 0; height: 86px; background: var(--kd-deep); color: var(--kd-cream-soft);
                display: flex; align-items: center; justify-content: center; gap: 14px; font-size: 15px;
                font-weight: 500; letter-spacing: 0.3em; text-transform: uppercase; border-top: 1px solid rgba(189,155,96,0.7); }
  .can .plate i { font-style: normal; color: var(--kd-gold); }
  .tag { position: absolute; top: 24px; right: 24px; padding: 8px 14px; border: 1px solid var(--kd-red); background: var(--kd-white);
         color: var(--kd-red); font-size: 13px; font-weight: 500; letter-spacing: 0.24em; text-transform: uppercase; }
</style>
</head>
<body>
  <div class="pattern"></div>
  <div class="copy">
    <div class="brand">
      <img src="../../assets/brand/KirkaDay_Logo_Horizontal_Web_Metallic.svg" alt="KirkaDay">
    </div>
    <p class="eyebrow" id="eyebrow"></p>
    <h1 id="headline"></h1>
    <p class="sub" id="sub"></p>
    <div class="rule"></div>
    <div class="url">kirka.day<span id="path"></span></div>
  </div>
  <div class="can"><img src="../../assets/can-hibiscus-900.webp" alt=""><div class="plate">Houston <i>✦</i> 2027</div></div>
  <div class="tag">Design preview</div>
  <div class="band"></div>
  <script>
    var q = new URLSearchParams(location.search);
    ['eyebrow', 'headline', 'sub', 'path'].forEach(function (k) {
      document.getElementById(k).innerHTML = q.get(k) || '';
    });
    ['w', 'left', 'top', 'ftop', 'fh'].forEach(function (k) {
      if (q.get(k)) document.documentElement.style.setProperty('--' + k, q.get(k));
    });
  </script>
</body>
</html>
